name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v1.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Test the govulncheck gate
        run: ./tests/test-govulncheck.sh

      - name: Test the baseline drift check
        run: ./tests/test-drift.sh

      - name: Test the silenced-checks report
        run: ./tests/test-silenced.sh

      - name: Test the diff-coverage gate
        run: ./tests/test-diff-coverage.sh

      - name: Test the Claude Code edit hook
        run: ./tests/test-hook.sh

      - name: Shellcheck
        run: shellcheck -S warning baseline/scripts/*.sh actions/*/*.sh tests/*.sh agent/*.sh

      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Test the Claude Code Stop hook
        run: ./tests/test-stop-hook.sh

      - name: Claude Code settings snippet is valid JSON
        run: jq -e '.permissions.deny | length > 0' agent/claude-settings.json

      - name: Release self-references match the tag
        if: startsWith(github.ref, 'refs/tags/v1.')
        run: |
          # go.yml must call its own actions at the release being tagged.
          all="$(grep -c 'gaius-codius/go-ci/actions/' .github/workflows/go.yml)"
          tagged="$(grep -c "gaius-codius/go-ci/actions/.*@${GITHUB_REF_NAME} " .github/workflows/go.yml)"
          echo "${tagged} of ${all} action references are at ${GITHUB_REF_NAME}"
          test "${all}" -gt 0 && test "${tagged}" = "${all}"

  go-workflow:
    # Runs go.yml as a project would, against the fixture module at the repository
    # root (go.mod, fixture/, and symlinks to the baseline and templates), so a
    # change to the workflow or the baseline runs before it's released. go.yml
    # still calls its actions at the last release; the actions job covers this commit's.
    uses: ./.github/workflows/go.yml
    with:
      runs-on: '["ubuntu-latest"]'
      fuzz: |
        ./fixture FuzzWords
      fuzz-time: 3s
      mise-cache: true
      tidy-check: true
      timeout-minutes: 15
      shellcheck: baseline/scripts/*.sh actions/*/*.sh tests/*.sh agent/*.sh
      deadcode: true
      diff-coverage: 80
      nilaway: true
      gorelease: true
      mutation: true

  actions:
    # This commit's composite actions against the fixture module.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Install pinned tools (mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: true

      - name: Compare with the go-ci baseline
        uses: ./actions/baseline-drift

      - name: Check for reachable vulnerabilities
        uses: ./actions/govulncheck

      - name: Flag checks switched off by this pull request
        if: github.event_name == 'pull_request'
        uses: ./actions/silenced-checks
        with:
          base: origin/${{ github.base_ref }}

      - name: Coverage profile for the diff-coverage gate
        if: github.event_name == 'pull_request'
        run: go test -coverprofile=coverage.out ./...

      - name: Check coverage of changed lines
        if: github.event_name == 'pull_request'
        uses: ./actions/diff-coverage
        with:
          base: origin/${{ github.base_ref }}
          min: 80
