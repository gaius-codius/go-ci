name: go

# Shared Go checks. Projects call this from their own ci.yml:
#   jobs:
#     go:
#       uses: gaius-codius/go-ci/.github/workflows/go.yml@<release commit SHA> # v1.x.y
#       with:
#         runs-on: '["self-hosted","linux","x64","<project>"]'
#         build: ./cmd/<project>/
# Tools come from the project's mise.toml (Go, golangci-lint, govulncheck, jq,
# and optionally shellcheck and deadcode). gopls is for editors and agents, so CI skips it.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as a JSON list, for example '["self-hosted","linux","x64","vigiles"]' or '["ubuntu-latest"]'.
        type: string
        required: true
      build:
        description: Package to build, for example ./cmd/vigiles/. Empty builds ./... instead.
        type: string
        default: ""
      fuzz:
        description: Fuzz targets, one "<package> <FuzzName>" per line. Empty skips fuzzing.
        type: string
        default: ""
      fuzz-time:
        description: How long each fuzz target runs.
        type: string
        default: 5s
      govulncheck-allowlist:
        description: Allowlist path, relative to the repository root.
        type: string
        default: scripts/govulncheck-allow.txt
      mise-cache:
        description: Let jdx/mise-action cache installs. Self-hosted runners keep them on disk, so the default is off.
        type: boolean
        default: false
      tidy-check:
        description: Fail when go.mod or go.sum need `go mod tidy` (runs `go mod tidy -diff` before the tests).
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout. GitHub's own default is 6 hours, long enough for a hung test to hold a self-hosted runner.
        type: number
        default: 30
      shellcheck:
        description: Paths or globs of shell scripts to run `shellcheck -S warning` on, separated by spaces or newlines. Empty skips it.
        type: string
        default: ""
      deadcode:
        description: Report unreachable functions with golang.org/x/tools/cmd/deadcode (report only, never fails). Needs the tool in mise.toml.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: test-vet-build
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # mise builds go: tools from source, so install only what this run uses.
      # gopls is for editors and agents. deadcode and shellcheck install on request.
      MISE_DISABLE_TOOLS: >-
        go:golang.org/x/tools/gopls${{ !inputs.deadcode && ',go:golang.org/x/tools/cmd/deadcode' || '' }}${{ inputs.shellcheck == '' && ',shellcheck' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pinned tools (mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: ${{ inputs.mise-cache }}

      - name: Check pinned Go version
        run: |
          test "$(go env GOVERSION)" = "go$(mise current go)"
          # go.mod's toolchain line must match mise.toml, so builds without mise use the same Go.
          test "$(go mod edit -json | jq -r .Toolchain)" = "go$(mise current go)"

      - name: Compare with the go-ci baseline
        uses: gaius-codius/go-ci/actions/baseline-drift@v1.0.2 # this release; see README "Changing go-ci"

      - name: Check go.mod and go.sum are tidy
        if: inputs.tidy-check
        run: go mod tidy -diff

      - name: Shellcheck
        if: inputs.shellcheck != ''
        env:
          SHELLCHECK_PATHS: ${{ inputs.shellcheck }}
        run: |
          # Unquoted on purpose: the input is a list of paths or globs.
          # shellcheck disable=SC2086
          shellcheck -S warning ${SHELLCHECK_PATHS}

      - name: Run tests (race detector, shuffled, with coverage)
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tail -n 1
          {
            echo "### Test coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fuzz untrusted-input parsers
        if: inputs.fuzz != ''
        env:
          FUZZ_TARGETS: ${{ inputs.fuzz }}
          FUZZ_TIME: ${{ inputs.fuzz-time }}
        run: |
          while read -r pkg target extra; do
            [[ -n "${pkg}" ]] || continue
            if [[ -z "${target}" || -n "${extra}" ]]; then
              echo "::error::fuzz lines are '<package> <FuzzName>', got: ${pkg} ${target} ${extra}"
              exit 1
            fi
            # go test passes when -fuzz matches nothing, so check the target exists first.
            if ! go test "${pkg}" -list "^${target}\$" | grep -qx "${target}"; then
              echo "::error::no fuzz target ${target} in ${pkg}"
              exit 1
            fi
            go test "${pkg}" -run '^$' -fuzz "^${target}\$" -fuzztime="${FUZZ_TIME}"
          done <<<"${FUZZ_TARGETS}"

      - name: Run go vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Check for reachable vulnerabilities
        uses: gaius-codius/go-ci/actions/govulncheck@v1.0.2 # this release
        with:
          allowlist: ${{ inputs.govulncheck-allowlist }}

      - name: Build
        env:
          BUILD: ${{ inputs.build }}
        run: go build "${BUILD:-./...}"

      - name: Report unreachable code (deadcode)
        if: inputs.deadcode
        run: |
          # Report only: findings and tool failures are warnings, never a failed job.
          if ! out=$(deadcode ./... 2>&1); then
            echo "::warning::deadcode failed, so unreachable code was not checked: ${out}"
            exit 0
          fi
          if [[ -z "${out}" ]]; then
            echo "deadcode: nothing unreachable"
            exit 0
          fi
          echo "::warning::deadcode found unreachable functions (see the job summary)"
          printf '%s\n' "${out}"
          {
            echo "### Unreachable code (deadcode)"
            echo
            echo '```'
            printf '%s\n' "${out}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
