# Pinned toolchain for local work, agents, and CI (jdx/mise-action).
# Run `mise install` after cloning or after this file changes.
# Renovate bumps these (renovate/go.json5); Go moves with the go.mod toolchain line.
[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
jq = "1.8.2"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:golang.org/x/tools/cmd/deadcode" = "0.52.0"
shellcheck = "0.11.0"
# Report-only checks the workflow runs when their inputs are on (README, "Inputs").
# nilaway and gorelease have no releases, so they pin a commit.
"go:go.uber.org/nilaway/cmd/nilaway" = "0.0.0-20260918162853-acb8859b9031"
"go:golang.org/x/exp/cmd/gorelease" = "0.0.0-20261014143641-f0251eb4aa3e"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.5.1"

[env]
# Use exactly the pinned Go; never let an inherited GOTOOLCHAIN switch versions.
GOTOOLCHAIN = "local"
