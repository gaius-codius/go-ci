name: diff coverage
description: >
  Fails when the share of changed Go code lines covered by tests is below a
  minimum. Warns on each uncovered range and lists them in the job summary.
  Needs a coverage profile and the base ref's history in the checkout.
inputs:
  base:
    description: Ref to compare with; the change is base...HEAD.
    required: true
  min:
    description: Minimum percentage of changed code lines covered, 0 to 100.
    required: true
  profile:
    description: Coverage profile from `go test -coverprofile`, relative to the workspace.
    default: coverage.out
runs:
  using: composite
  steps:
    - name: Check coverage of changed lines
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        MIN: ${{ inputs.min }}
        PROFILE: ${{ inputs.profile }}
      run: '"${GITHUB_ACTION_PATH}/diff-coverage.sh"'
