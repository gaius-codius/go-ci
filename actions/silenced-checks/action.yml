name: silenced checks
description: >
  Warns (never fails) about lines a change adds that switch a check off:
  //nolint, #nosec and //lint:ignore in Go files, t.Skip in tests, changes to
  .golangci.yml, and new govulncheck allowlist entries. Writes a job-summary
  table for a person to review. Needs the base ref's history in the checkout.
inputs:
  base:
    description: Ref to compare with; the change is base...HEAD.
    required: true
  allowlist:
    description: govulncheck allowlist path, relative to the workspace.
    default: scripts/govulncheck-allow.txt
runs:
  using: composite
  steps:
    - name: Flag checks switched off by this change
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        ALLOWLIST: ${{ inputs.allowlist }}
      run: '"${GITHUB_ACTION_PATH}/silenced.sh"'
